worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        location = /omega-factory { return 308 /omega-factory/$is_args$args; }
        location = /omega-factory/healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location /omega-factory/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
        }
        location = /omega-factory/manifest.webmanifest {
            default_type application/manifest+json;
            types { }
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
        }
        location = /omega-factory/sw.js {
            types { }
            default_type text/javascript;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
            add_header Service-Worker-Allowed "/omega-factory/";
        }
        location /omega-factory/ {
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
            include /etc/nginx/security-headers.conf;
        }
        location / { return 404; }
    }
}
